<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Zebra">
  <!-- Menu bar glyph: solid silhouette with the stripes punched out, so macOS
       can tint it as a template image and the stripes read as gaps. -->
  <defs>
    <mask id="cut">
      <rect width="512" height="512" fill="black"/>
      <!-- visible ink -->
      <ellipse cx="188" cy="172" rx="26" ry="46" transform="rotate(-22 188 172)" fill="white"/>
      <ellipse cx="324" cy="172" rx="26" ry="46" transform="rotate(22 324 172)" fill="white"/>
      <ellipse cx="256" cy="278" rx="88" ry="122" fill="white"/>
      <ellipse cx="256" cy="366" rx="60" ry="37" fill="white"/>
      <!-- stripe gaps -->
      <path d="M246 150 L268 150 L262 258 L252 258 Z" fill="black"/>
      <path d="M208 162 L228 155 L238 260 L224 262 Z" fill="black"/>
      <path d="M286 155 L306 162 L290 262 L276 260 Z" fill="black"/>
      <path d="M172 192 L192 178 L208 264 L190 268 Z" fill="black"/>
      <path d="M322 178 L342 192 L324 268 L306 264 Z" fill="black"/>
      <!-- nostrils -->
      <ellipse cx="235" cy="364" rx="9" ry="11" fill="black"/>
      <ellipse cx="277" cy="364" rx="9" ry="11" fill="black"/>
    </mask>
  </defs>
  <rect width="512" height="512" fill="black" mask="url(#cut)"/>
</svg>
