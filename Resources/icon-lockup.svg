<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Horizon">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#39404f"/>
      <stop offset="45%" stop-color="#232833"/>
      <stop offset="100%" stop-color="#12151b"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b8bf9" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#5b5bf6" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#8b8bf9" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#5b5bf6" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#5b5bf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e7e2d7"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="24" y="24" width="464" height="464" rx="108"/>
    </clipPath>
    <clipPath id="headClip">
      <ellipse cx="256" cy="278" rx="88" ry="122"/>
    </clipPath>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#card)"/>

  <g clip-path="url(#cardClip)">
    <rect x="24" y="24" width="464" height="250" fill="url(#sheen)"/>
    <ellipse cx="256" cy="300" rx="250" ry="200" fill="url(#glow)"/>

    <!-- zebra, sized down and moved to the left of the lockup -->
    <g transform="translate(152,252) scale(0.55) translate(-256,-278)">
      <ellipse cx="188" cy="172" rx="26" ry="46" transform="rotate(-22 188 172)" fill="url(#coat)"/>
      <ellipse cx="190" cy="178" rx="12" ry="27" transform="rotate(-22 190 178)" fill="#2b313c"/>
      <ellipse cx="324" cy="172" rx="26" ry="46" transform="rotate(22 324 172)" fill="url(#coat)"/>
      <ellipse cx="322" cy="178" rx="12" ry="27" transform="rotate(22 322 178)" fill="#2b313c"/>

      <ellipse cx="256" cy="278" rx="88" ry="122" fill="url(#coat)"/>

      <g clip-path="url(#headClip)" fill="#13161d">
        <path d="M244 146 L272 146 L265 262 L250 262 Z"/>
        <path d="M204 158 L230 150 L241 264 L222 266 Z"/>
        <path d="M282 150 L308 158 L290 266 L271 264 Z"/>
        <path d="M166 188 L192 172 L210 268 L186 272 Z"/>
        <path d="M320 172 L346 188 L326 272 L302 268 Z"/>
        <path d="M150 244 L174 234 L182 296 L156 300 Z"/>
        <path d="M338 234 L362 244 L356 300 L330 296 Z"/>
      </g>

      <path d="M224 176 Q256 132 288 176 Q256 160 224 176 Z" fill="#13161d"/>
      <ellipse cx="212" cy="292" rx="12" ry="14" fill="#13161d"/>
      <ellipse cx="300" cy="292" rx="12" ry="14" fill="#13161d"/>
      <ellipse cx="256" cy="366" rx="60" ry="37" fill="#39414f"/>
      <ellipse cx="235" cy="362" rx="8" ry="10" fill="#12151b"/>
      <ellipse cx="277" cy="362" rx="8" ry="10" fill="#12151b"/>
    </g>

    <!-- wordmark, to the right of the zebra -->
    <text x="252" y="256" fill="#e8eaee"
          font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="37" font-weight="600" letter-spacing="0.5">HORIZON</text>
    <text x="254" y="288" fill="#8b8bf9"
          font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="15" font-weight="500" letter-spacing="4.2">BALANCE</text>
  </g>

  <rect x="24.5" y="24.5" width="463" height="463" rx="107.5" fill="none" stroke="url(#rim)" stroke-width="2.5"/>
</svg>
