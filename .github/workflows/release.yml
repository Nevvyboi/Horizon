name: Release

# Build the Horizon menu bar app and attach it to a GitHub Release.
# macOS only: Horizon is a native Swift/SwiftUI app.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build and bundle
        run: |
          chmod +x scripts/bundle.sh
          ./scripts/bundle.sh

      - name: Zip the app
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent Horizon.app Horizon-macOS.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: build/Horizon-macOS.zip
          name: Horizon ${{ github.ref_name }}
          body: |
            Horizon, a menu bar balance forecaster for Investec.

            Download `Horizon-macOS.zip`, unzip it and drag Horizon.app to
            Applications. The build is unsigned, so on first launch right click
            the app and choose Open to get past Gatekeeper.
